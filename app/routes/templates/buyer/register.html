{% extends "buyer/base.html" %}
{% block title %}Register — Sowtrust{% endblock %}
{% block content %}
<div class="card">
  <h1>Create your buyer account</h1>
  <form method="post">
    <label>Full name</label>
    <input type="text" name="name" value="{{ form.get('name','') }}" required>

    <label>Business name (optional)</label>
    <input type="text" name="business_name" value="{{ form.get('business_name','') }}">

    <label>Buyer type</label>
    <select name="buyer_type" required>
      <option value="" disabled {{ 'selected' if not form.get('buyer_type') }}>Select one</option>
      {% for t in buyer_types %}
        <option value="{{ t }}" {{ 'selected' if form.get('buyer_type') == t }}>{{ t }}</option>
      {% endfor %}
    </select>

    <label>Phone number</label>
    <input type="tel" name="phone" placeholder="08011112222" value="{{ form.get('phone','') }}" required>

    <label>Email</label>
    <input type="email" name="email" value="{{ form.get('email','') }}" required>

    <label>Delivery address</label>
    <input type="text" name="delivery_address" value="{{ form.get('delivery_address','') }}" required>

    <label>City</label>
    <input type="text" name="city" value="{{ form.get('city','') }}" required>

    <label>State</label>
    <input type="text" name="state" value="{{ form.get('state','') }}" required>

    <label>Password</label>
    <input type="password" name="password" minlength="6" required>

    <button type="submit">Create account</button>
  </form>
  <p class="muted" style="margin-top:14px;">
    Already have an account? <a class="plain" href="{{ url_for('buyer_web.login') }}">Log in</a>
  </p>
</div>
{% endblock %}
