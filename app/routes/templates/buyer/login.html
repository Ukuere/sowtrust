{% extends "buyer/base.html" %}
{% block title %}Log in — Sowtrust{% endblock %}
{% block content %}
<div class="card">
  <h1>Log in</h1>
  <form method="post">
    <label>Phone number</label>
    <input type="tel" name="phone" placeholder="08011112222" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit">Log in</button>
  </form>
  <p class="muted" style="margin-top:14px;">
    New here? <a class="plain" href="{{ url_for('buyer_web.register') }}">Create an account</a>
  </p>
</div>
{% endblock %}
