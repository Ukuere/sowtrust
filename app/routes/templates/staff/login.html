{% extends "public/base.html" %}
{% block title %}Staff login | SowTrust{% endblock %}
{% block content %}<div class="content"><h1>Staff login</h1><p>Authorized SowTrust operations and review staff only.</p><div class="form-card"><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button" type="submit">Sign in securely</button></form></div></div>{% endblock %}
