{% extends "logistics/base.html" %}
{% block title %}Log in — Sowtrust Logistics{% endblock %}
{% block content %}
<div class="card">
  <h1>Log in</h1>
  <form method="post">
    <label>Phone number</label>
    <input type="tel" name="phone" placeholder="08011112222" required>

    <label>PIN</label>
    <input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>

    <button type="submit">Log in</button>
  </form>
  <p class="muted" style="margin-top:14px;">
    New here? <a class="plain" href="{{ url_for('logistics_web.register') }}">Register</a>
  </p>
</div>
{% endblock %}
